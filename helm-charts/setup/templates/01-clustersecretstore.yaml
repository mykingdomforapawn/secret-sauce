---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  # Defines the provider (Vault).
  provider:
    vault:
      # The internal Kubernetes DNS address for the Vault service.
      # Format: <service-name>.<namespace>.svc.cluster.local
      server: "http://vault.vault.svc.cluster.local:8200"

      # The path to the KV secrets engine. "kv" is the default.
      path: "secret"

      # Specifies the KV-v2 engine.
      version: "v2"

      # --- This is the key part ---
      # Tells ESO to use the Kubernetes Auth Method.
      auth:
        kubernetes:
          # The path where K8s auth was enabled in Vault.
          mountPath: "kubernetes"

          # The name of the Vault Role to use.
          # This will be created in the next step.
          role: "secret-reader"
