---
# --- Helm Repositories ---
# Defines the remote chart repositories used by Helmfile.
repositories:
  # Repository for HashiCorp charts (Vault, etc.).
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  # Repository for the Traefik Ingress controller.
  - name: traefik
    url: https://helm.traefik.io/traefik
  # Repository for the External Secrets Operator.
  - name: external-secrets
    url: https://charts.external-secrets.io

# --- Helm Releases ---
# Defines the list of software to deploy into the cluster.
releases:
  # --- Release: HashiCorp Vault ---
  - name: vault
    # Deploys into the 'vault' namespace.
    namespace: vault
    # Creates the namespace if it does not exist.
    createNamespace: true
    # Specifies the chart to use from the 'hashicorp' repo.
    chart: hashicorp/vault
    # Pins the chart version for reproducible builds.
    version: 0.28.0
    # Loads configuration overrides from a local values file.
    values:
      - ./helm-values/vault.yaml

  # --- Release: Traefik (Ingress) ---
  - name: traefik
    # Deploys into the 'traefik' namespace.
    namespace: traefik
    # Creates the namespace if it does not exist.
    createNamespace: true
    # Specifies the chart to use from the 'traefik' repo.
    chart: traefik/traefik
    # Pins the chart version.
    version: 26.1.0
    # Loads configuration overrides from a local values file.
    values:
      - ./helm-values/traefik.yaml

  # --- Release: External Secrets Operator ---
  - name: external-secrets
    # Deploys into the 'external-secrets' namespace.
    namespace: external-secrets
    # Creates the namespace if it does not exist.
    createNamespace: true
    # Specifies the chart to use from the 'external-secrets' repo.
    chart: external-secrets/external-secrets
    # Pins the chart version.
    version: 0.9.13
    # Loads configuration overrides from a local values file.
    values:
      - ./helm-values/external-secrets.yaml

  # --- Release: Local Setup Chart ---
  # Deploys project-specific manifests (ClusterSecretStore) and the setup Job.
  - name: secret-sauce-setup
    # Deploys into the 'default' namespace.
    namespace: default
    # Points to the local chart path in the repository.
    chart: ./helm-charts/setup
    # Ensures this chart installs only after Vault and ESO are ready.
    needs:
      - "vault/vault"
      - "external-secrets/external-secrets"

    # Defines a hook to pause execution until dependencies are available.
    hooks:
      # Runs this command before the 'sync' operation for this release.
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - "wait"
          - "--namespace=external-secrets"
          - "--for=condition=Available"
          - "deployment/external-secrets-webhook"
          - "--timeout=60s"

  # --- Release: Secret Reader App ---
  # Deploys the demo application that consumes the secrets.
  - name: secret-reader
    # Deploys into the 'default' namespace.
    namespace: default
    # Points to the local chart path in the repository.
    chart: ./helm-charts/secret-reader
    # Ensures the setup Job has configured Vault before the app starts.
    needs:
      - "default/secret-sauce-setup"

  # --- Release: PostgreSQL ---
  # Deploys the database used for the Dynamic Secrets demo.
  - name: postgres
    # Deploys into the 'default' namespace.
    namespace: default
    # Uses the Bitnami PostgreSQL chart from the OCI registry.
    chart: oci://registry-1.docker.io/bitnamicharts/postgresql
    # Pins the chart version to a release with a valid image tag.
    version: 18.1.12
    values:
      - auth:
          # HACK: Hardcoded password for local development simplicity.
          # Production should use an existing secret via 'auth.existingSecret'.
          postgresPassword: "rootpassword"
          username: "postgres"
      - primary:
          persistence:
            # HACK: Disables persistence. Data is lost on pod restart.
            # Production requires a PersistentVolumeClaim (PVC).
            enabled: false
