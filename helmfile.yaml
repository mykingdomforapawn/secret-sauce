---
# Defines the Helm repositories needed for the charts.
repositories:
  # Repository for HashiCorp charts (Vault, etc.)
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  # Repository for the Traefik Ingress controller.
  - name: traefik
    url: https://helm.traefik.io/traefik
  # Repository for the External Secrets Operator.
  - name: external-secrets
    url: https://charts.external-secrets.io

# Defines the list of Helm releases to deploy.
releases:
  # -----------------------------------------------------------------
  # Release: HashiCorp Vault
  # Purpose: The central secrets manager.
  # -----------------------------------------------------------------
  - name: vault
    # Deploys into the 'vault' namespace.
    namespace: vault
    # Creates the namespace if it doesn't exist.
    createNamespace: true
    # Defines the chart to use.
    chart: hashicorp/vault
    # Pins the chart version for stable, repeatable deployments.
    version: 0.28.0
    # Points to the external values file.
    values:
      - ./helm-values/vault.yaml

  # -----------------------------------------------------------------
  # Release: Traefik
  # Purpose: Exposes HTTP/HTTPS services to the host machine.
  # -----------------------------------------------------------------
  - name: traefik
    # Deploys into the 'traefik' namespace.
    namespace: traefik
    createNamespace: true
    chart: traefik/traefik
    # Pins the chart version.
    version: 26.1.0
    # Points to the external values file.
    values:
      - ./helm-values/traefik.yaml

  # -----------------------------------------------------------------
  # Release: External Secrets Operator
  # Purpose: The "bridge" that syncs secrets from Vault to K8s.
  # -----------------------------------------------------------------
  - name: external-secrets
    # Deploys into the 'external-secrets' namespace.
    namespace: external-secrets
    createNamespace: true
    chart: external-secrets/external-secrets
    # Pins the chart version.
    version: 0.9.13
    # Points to the external values file.
    values:
      - ./helm-values/external-secrets.yaml

  # -----------------------------------------------------------------
  # Release: Local Setup Chart
  # Purpose: Deploys our custom manifests and config job.
  # -----------------------------------------------------------------
  - name: secret-sauce-setup
    # Deploys into the 'default' namespace.
    namespace: default
    # This chart is a local file path.
    chart: ./helm-charts/setup
    # This ensures the setup job only runs after Vault and ESO are ready.
    needs:
      - "vault/vault"
      - "external-secrets/external-secrets"

    # Smart timer to ensure dependencies are ready.
    hooks:
      # Run this command before installing this chart.
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - "wait"
          - "--namespace=external-secrets"
          - "--for=condition=Available"
          - "deployment/external-secrets-webhook"
          - "--timeout=60s"

  # -----------------------------------------------------------------
  # Release: Secret Reader App
  # -----------------------------------------------------------------
  - name: secret-reader
    namespace: default
    # Point to your local folder
    chart: ./helm-charts/secret-reader
    # No "values:" section needed here!
    needs:
      - "default/secret-sauce-setup"
