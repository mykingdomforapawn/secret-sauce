---
# --- Server Settings ---
# Configures the core Vault server parameters.
server:
  # HACK: Enables Vault's 'dev' mode.
  # This setting starts Vault unsealed with a known 'root' token for local testing.
  dev:
    enabled: true

  # Disables the high-availability (HA) mode.
  # HA is unnecessary for a single-node local cluster setup.
  ha:
    enabled: false

# --- UI Settings ---
# Controls the availability of the Vault web interface.
ui:
  # Disables the Vault UI to maintain a minimal deployment footprint.
  enabled: false
