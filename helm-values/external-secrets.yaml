---
# --- Installation Settings ---
# Automatically installs the Custom Resource Definitions (CRDs).
installCRDs: true

# --- Webhook Settings ---
# Deploys the validating and mutating webhooks.
webhook:
  # Sets the port for the webhook server.
  port: 9443

# --- Certificate Controller Settings ---
# Deploys the controller for webhook TLS certificates.
certController:
  # Enables the certificate controller deployment.
  create: true

# --- Controller Settings ---
# Deploys the main operator for reconciling ExternalSecret objects.
controller:
  # Enables the main controller deployment.
  create: true
