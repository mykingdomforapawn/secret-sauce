---
# --- Installation Settings ---
# Automatically installs the Custom Resource Definitions (CRDs)
# required for ExternalSecrets, SecretStores, etc.
installCRDs: true

# --- Webhook Settings ---
# Deploys the validating and mutating webhooks.
webhook:
  # Port for the webhook server.
  port: 9443

# --- Certificate Controller Settings ---
# Deploys the controller responsible for provisioning
# TLS certificates for the webhook.
certController:
  create: true

# --- Controller Settings ---
# Deploys the main operator that reconciles ExternalSecret objects.
controller:
  create: true
